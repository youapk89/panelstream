<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PanelStream</title>

<link rel="stylesheet" href="style.css">

<!-- Librería Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="app">

<h1>PanelStream</h1>

<p>Control de clientes, servicios y vencimientos</p>


<div class="card">

<h2>Ingreso administrador</h2>

<input id="email" type="email" placeholder="Correo administrador">

<input id="password" type="password" placeholder="Contraseña">


<button onclick="login()">
Ingresar
</button>


<p id="mensaje"></p>

</div>


<div id="panel" class="card" style="display:none;">

<h2>Panel Administrativo</h2>

<p>Bienvenido al sistema PanelStream</p>

</div>


</div>


<script src="app.js"></script>

</body>
</html>
